[package]
name = "flightdeck"
version = "0.1.0"
description = "FlightDeck — MSFS 2024 desktop companion for commercial IFR flight planning"
authors = ["FlightDeck"]
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Used by Tauri for IPC and protocol handling; the UI itself talks to the
# local planning API (http://localhost:8124) through the WebView's fetch(),
# which needs no Tauri capability.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# This feature is used for production builds or when `devUrl` is set to an
# external URL such as a dev-server. Tauri enables this by default when
# building for production (not `tauri dev`).
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
